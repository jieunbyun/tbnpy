name: Release

# A tag such as v0.3.0 tests, builds and publishes that commit to PyPI.
# Running the workflow by hand does the same but publishes to TestPyPI.
# Building here, from a clean checkout, means a release holds only committed files.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tbnpy with its test and build tools
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]" build twine

      - name: Check that the tag matches the version
        if: github.event_name == 'push'
        run: |
          version=$(python -c "import tbnpy; print(tbnpy.__version__)")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match tbnpy.__version__ = ${version}"
            exit 1
          fi

      - name: Run the tests
        run: python -m pytest -q tests

      - name: Build the sdist and wheel
        run: python -m build

      - name: Check the distributions
        run: twine check dist/*

      - name: Upload the distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tbnpy/
    permissions:
      id-token: write          # trusted publishing: no API token is stored
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/tbnpy/
    permissions:
      id-token: write
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
